{% for chat in chats %}
    <div class="card mb-2 shadow-sm">
        <div class="card-body p-2">
            <a href="{% url 'core:chat_detail' chat.id %}" class="card-title h6 text-decoration-none">
                {{ chat.name }}
            </a>
        </div>
    </div>
{% empty %}
    <div class="alert alert-info mt-2">
        No chats available.
    </div>
{% endfor %}
