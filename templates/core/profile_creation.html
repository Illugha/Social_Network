{% extends 'base.html' %}
{% block content %}
    <h1>Create Your Profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Profile</button>
    </form>
    <a href="{% url 'core:login' %}">Already have an account? Log in here.</a>
{% endblock %}
