{% extends 'base.html' %}
{% block content %}
    <h1>Update Your Profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Profile</button>
    </form>
    <a href="{% url 'core:profile_detail' %}">Back</a>
{% endblock %}
